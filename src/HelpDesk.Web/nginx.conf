# Interfaz de la Mesa de Ayuda + proxy hacia el backend (servicio "backend" de Docker Compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Importación de Excel: hasta 30 MB (TamanoMaximoImportacionMb) más margen.
    client_max_body_size 40m;
    server_tokens off;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada pedido,
    # así nginx arranca aunque el backend todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------- API
    
   location /api {
    resolver 1.1.1.1 valid=30s;
    set $backend https://mesadeayuda-backend.onrender.com;

    proxy_pass $backend;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_set_header Host mesadeayuda-backend.onrender.com;

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
}

    # ---------------------------------------------------------------- archivos con hash
    location /assets/ {
        include /etc/nginx/conf.d/seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- aplicación (SPA)
    location / {
        include /etc/nginx/conf.d/seguridad.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
